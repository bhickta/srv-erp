name: Build Tally Bridge for Windows

on:
  workflow_dispatch:
  push:
    branches:
      - version-15
    paths:
      - ".github/workflows/build-tally-bridge-windows.yml"
      - "srv_erp/tally_bridge/**"
      - "tally_plugin/**"

permissions:
  contents: write

concurrency:
  group: tally-bridge-windows-release
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tally_plugin/requirements-build.txt

      - name: Run bridge tests
        run: python -m unittest srv_erp.tests.test_tally_bridge

      - name: Build standalone executable and package
        shell: powershell
        run: .\tally_plugin\build-windows.ps1

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: SRV-Tally-Bridge-Windows-x64
          path: |
            dist/SRV-Tally-Bridge-Windows-x64.zip
            dist/SRV-Tally-Bridge-Windows-x64.zip.sha256
          if-no-files-found: error

      - name: Update rolling GitHub prerelease
        if: github.event_name == 'push'
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "tally-bridge-latest"
          $notes = "Standalone Windows x64 Tally bridge built from commit $env:GITHUB_SHA. Python is not required on the Tally computer."
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh api --method PATCH "repos/$env:GITHUB_REPOSITORY/git/refs/tags/$tag" --field sha="$env:GITHUB_SHA" -F force=true
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            gh release edit $tag --title "Tally Bridge Latest" --notes $notes --prerelease
          } else {
            gh release create $tag --target "$env:GITHUB_SHA" --title "Tally Bridge Latest" --notes $notes --prerelease
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          gh release upload $tag "dist/SRV-Tally-Bridge-Windows-x64.zip" "dist/SRV-Tally-Bridge-Windows-x64.zip.sha256" --clobber
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
