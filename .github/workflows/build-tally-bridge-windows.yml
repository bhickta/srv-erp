name: Build Tally Bridge for Windows

on:
  workflow_dispatch:
  push:
    branches:
      - version-15
    paths:
      - ".github/workflows/build-tally-bridge-windows.yml"
      - "srv_erp/tally_bridge/**"
      - "tally_plugin/**"

permissions:
  contents: write

concurrency:
  group: tally-bridge-windows-release
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tally_plugin/requirements-build.txt

      - name: Run bridge tests
        run: python -m unittest srv_erp.tests.test_tally_bridge

      - name: Build standalone executable and package
        shell: powershell
        run: .\tally_plugin\build-windows.ps1

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: SRV-Tally-Bridge-Windows-x64
          path: |
            dist/SRV-Tally-Bridge-Windows-x64.zip
            dist/SRV-Tally-Bridge-Windows-x64.zip.sha256
          if-no-files-found: error

      - name: Update rolling GitHub prerelease
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: tally-bridge-latest
          target_commitish: ${{ github.sha }}
          name: Tally Bridge Latest
          body: Standalone Windows x64 Tally bridge built from commit ${{ github.sha }}. Python is not required on the Tally computer.
          prerelease: true
          make_latest: false
          fail_on_unmatched_files: true
          overwrite_files: true
          files: |
            dist/SRV-Tally-Bridge-Windows-x64.zip
            dist/SRV-Tally-Bridge-Windows-x64.zip.sha256
