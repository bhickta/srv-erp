worker_processes 1;
pid /home/bhickta/development/dev-frappe-bench/run/nginx.pid;
error_log /home/bhickta/development/dev-frappe-bench/logs/nginx.error.log;
events { worker_connections 256; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /home/bhickta/development/dev-frappe-bench/logs/nginx.access.log;
    client_body_temp_path /home/bhickta/development/dev-frappe-bench/runtime/nginx/client_temp;
    proxy_temp_path /home/bhickta/development/dev-frappe-bench/runtime/nginx/proxy_temp;
    fastcgi_temp_path /home/bhickta/development/dev-frappe-bench/runtime/nginx/fastcgi_temp;
    uwsgi_temp_path /home/bhickta/development/dev-frappe-bench/runtime/nginx/uwsgi_temp;
    scgi_temp_path /home/bhickta/development/dev-frappe-bench/runtime/nginx/scgi_temp;
    sendfile on;
    client_max_body_size 50m;
    map $http_upgrade $dev_connection { default upgrade; '' close; }
    map $http_x_forwarded_proto $dev_scheme { default $scheme; https https; }
    server {
        listen 127.0.0.1:8081;
        server_name deverp.srvelectricals.in;
        root /home/bhickta/development/dev-frappe-bench/sites;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-SRV-Environment "development" always;
        add_header X-Content-Type-Options nosniff always;
        location ^~ /.well-known/acme-challenge/ {
            root /home/bhickta/development/dev-frappe-bench/runtime/acme;
            try_files $uri =404;
        }
        location /assets/ { try_files $uri =404; }
        location /files/ {
            try_files /deverp.srvelectricals.in/public/$uri @app;
            add_header Content-Disposition "attachment";
        }
        location /protected/ {
            internal;
            alias /home/bhickta/development/dev-frappe-bench/sites/deverp.srvelectricals.in/;
        }
        location /socket.io {
            proxy_pass http://unix:/home/bhickta/development/dev-frappe-bench/run/socketio.sock;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $dev_connection;
            proxy_set_header X-Frappe-Site-Name deverp.srvelectricals.in;
            proxy_set_header Host deverp.srvelectricals.in;
            proxy_set_header Origin $dev_scheme://deverp.srvelectricals.in;
        }
        location / { try_files /deverp.srvelectricals.in/public/$uri @app; }
        location @app {
            proxy_pass http://127.0.0.1:8010;
            proxy_http_version 1.1;
            proxy_set_header Host deverp.srvelectricals.in;
            proxy_set_header X-Frappe-Site-Name deverp.srvelectricals.in;
            proxy_set_header X-Forwarded-Proto $dev_scheme;
            proxy_set_header X-Forwarded-For $http_x_forwarded_for;
            proxy_set_header X-Use-X-Accel-Redirect True;
            proxy_read_timeout 120;
            proxy_redirect off;
        }
    }
}
