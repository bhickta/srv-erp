# Additive vhost: does not edit the production bench's nginx configuration.
server {
    listen 80;
    listen [::]:80;
    server_name deverp.srvelectricals.in;
    location ^~ /.well-known/acme-challenge/ {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
    }
    location / { return 503 "Development HTTPS activation is pending.\n"; }
}
