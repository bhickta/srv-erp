[unix_http_server]
file=/home/bhickta/development/dev-frappe-bench/run/supervisor.sock
chmod=0700
[supervisord]
logfile=/home/bhickta/development/dev-frappe-bench/logs/supervisord.log
pidfile=/home/bhickta/development/dev-frappe-bench/run/supervisord.pid
childlogdir=/home/bhickta/development/dev-frappe-bench/logs
logfile_maxbytes=10MB
logfile_backups=2
[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface
[supervisorctl]
serverurl=unix:///home/bhickta/development/dev-frappe-bench/run/supervisor.sock

